<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad Muhebzada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5e2fb5 0%, #a855f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .content {
            min-height: 150px;
            margin: 30px 0;
        }
        
        .text-item {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }
        
        .text-item.active {
            display: block;
        }
        
        .text-item p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.8;
            margin: 15px 0;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn {
            .btn {
    background: #7c3aed;
    color: white;
    padding: 15px 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.0em;
    transition: all 0.3s;
    margin-top: 20px;
}

.btn:hover {
    background: #a855f7;
    transform: translateY(-2px);
}
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .social-links {
            margin-top: 30px;
            display: none;
        }
        
        .social-links.active {
            display: block;
        }
        
        .social-links a {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: #8b0000;
            color: white;
            border-radius: 50%;
            line-height: 60px;
            text-align: center;
            margin: 0 10px;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 1.8em;
        }
        
        .social-links a:hover {
            background: #dc143c;
            transform: scale(1.2);
        }
    </style>
</head>
