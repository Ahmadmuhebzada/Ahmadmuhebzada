<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmad muhebzada </title>

<style>
*{
    .gallery{
    margin-top:40px;
}

.gallery h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.gallery-grid img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    transition:.3s;
    cursor:pointer;
}

.gallery-grid img:hover{
    transform:scale(1.05);
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:500px;
    max-width:90%;
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h1{
    color:#333;
    margin-bottom:20px;
}

p{
    color:#666;
    line-height:1.8;
    margin-bottom:25px;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:8px;
    background:#667eea;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#764ba2;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.menu button{
    display:block;
    width:100%;
    margin:10px 0;
}

.info{
    text-align:right;
    margin-top:20px;
    line-height:2;
}
</style>

</head>
<body>

<div class="box">

    <!-- صفحه اول -->
    <div id="page1" class="page active">
        <h1>👋 سلام</h1>
        <p>به سایت من خوش آمدی.</p>
        <button onclick="nextPage(2)">کلیک کن</button>
    </div>

    <!-- صفحه دوم -->
    <div id="page2" class="page">
        <h1>😊 خوش اومدی</h1>
        <p>می‌دونی اینجا چی داریم؟<br><br>
        نمی‌دونی؟<br>
    باشه عیب نداره با هم میریم میبینم این داخل چی داریم .</p>

        <button onclick="nextPage(3)">بریم</button>
    </div>

    <!-- صفحه سوم -->
    <div id="page3" class="page">
        <h1>🏠 صفحه اصلی</h1>

        <div class="menu">
            <button onclick="showAbout()">درباره من</button>
            <button href="countries.html" class="button">Citys</a>
        </div>

        <div id="about" class="info" style="display:none;">
            <h3>Back</h3>
            <p>
                👤 نام: احمد<br>
                📧 ایمیل: ahmuhebzada@gmail.com<br>
                📱 شماره تماس:93770625059<br>
                📍 آدرس: کابل، افغانستان
            </p>
        </div>

    </div>

</div>

<script>

function nextPage(page){

    document.querySelectorAll(".page").forEach(function(item){
        item.classList.remove("active");
    });

    document.getElementById("page"+page).classList.add("active");
}

function showAbout(){

    document.getElementById("about").style.display="block";

}

</script>

</body>
</html>
