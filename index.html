<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اAhmad Muhebzada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6f2da8 0%, #a855f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .btn {
            background: #8b0000;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            margin: 10px;
        }
        
        .btn:hover {
            background: #dc143c;
            transform: translateY(-2px);
        }
        
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 20px auto;
            border: 3px solid #8b0000;
        }
        
        .contact-info {
            text-align: right;
            margin: 20px 0;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        
        .contact-info p {
            margin: 10px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- صفحه اول -->
        <div class="page active" id="page1">
            <h1>👋 سلام!</h1>
            <button class="btn" onclick="greet()">کلیک کن!</button>
            <p>یه سایت من خوش آمدی </p>
            <button class="btn" onclick="greet()">کلیک کن!</button>
            <p id="message">خیلی خوشحالم که اینجایی!</p>
            <button class="btn" onclick="greet()">کلیک کن!</button>
            <p id="message">برای آخرین بار کلیک کن!</p>
            <button class="btn" onclick="greet()">کلیک کن!</button>
            <p id="message">میدونی داخل این سایت چه است ؟ نمی دونی باشه پس کلیک کن تا بریم بیبینیم </p>
            <button class="btn" onclick="greet()">کلیک کن!</button>
            <button class="btn" onclick="goToPage2()">راه های ارتباطی </button>
        </div>
        
        <!-- صفحه دوم -->
        <div class="page" id="page2">
            <h1>📝 درباره من</h1>
            
            <!-- اینجا عکس قرار می‌گیره -->
            <img src="https://via.placeholder.com/150" alt="عکس پروفایل" class="profile-img">
            
            <div class="contact-info">
                <p><strong>📧 ایمیل:</strong> ahmuhebzada@gmail.com</p>
                <p><strong>📱 شماره تماس:</strong> +93787091019</p>
                <p><strong>📍 شهر:</strong> Kabul Afghanistan</p>
            </div>
            
            <button class="btn" onclick="goToPage1()">بازگشت</button>
        </div>
    </div>
    
    <script>
        function greet() {
            document.getElementById('message').textContent = 'خیلی عالی است! 🎉';
        }
        
        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
        }
        
        function goToPage1() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        }
    </script>
</body>
</html>
